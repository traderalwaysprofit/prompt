name: Command Data V2 Schema Validation

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/validate-data.mjs'
      - '.github/workflows/command-data-v2-schema-validation.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/validate-data.mjs'
      - '.github/workflows/command-data-v2-schema-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-validation:
    name: Validate complete runtime schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate command, category, and example contracts
        run: npm run validate:data

      - name: Schema validation summary
        if: always()
        run: |
          {
            echo "## Command Data V2 Schema Validation"
            echo ""
            echo "- Numeric command IDs"
            echo "- Required fields: name, categoryId, description, template"
            echo "- 200 commands + 20 categories + 200 examples"
            echo "- Unique IDs and category/example cross-references"
          } >> "$GITHUB_STEP_SUMMARY"
