name: Observability Smoke

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Reviewed target config path
        required: true
        default: config/observability-targets.production.json
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: observability-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONFIG_PATH: ${{ inputs.config_path }}
      OBSERVABILITY_TIMEOUT_MS: '4000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate reviewed target config
        run: node scripts/validate-observability-config.mjs "$CONFIG_PATH"

      - name: Probe monitored targets
        run: node scripts/check-observability-targets.mjs "$CONFIG_PATH"

      - name: Operational summary
        if: always()
        run: |
          {
            echo "## Observability Smoke"
            echo ""
            echo "- Config: $CONFIG_PATH"
            echo "- Timeout: ${OBSERVABILITY_TIMEOUT_MS}ms"
            echo "- This workflow performs read-only health probes only."
            echo "- It does not enable production observability, mutate routes, or send alerts."
          } >> "$GITHUB_STEP_SUMMARY"
