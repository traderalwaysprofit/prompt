name: SAMSON Preview Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: samson-preview-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview-verification:
    name: preview-verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: masumi-crm-preview
    env:
      NO_COLOR: 1
      PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      PREVIEW_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
    steps:
      - name: Checkout exact preview revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PREVIEW_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build exact preview revision
        env:
          WORKERS_CI_COMMIT_SHA: ${{ env.PREVIEW_SHA }}
        run: npm run build

      - name: Detect trusted Cloudflare preview capability
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PREVIEW_HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" &&
                -n "${CLOUDFLARE_API_TOKEN:-}" &&
                -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            npx wrangler whoami
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "mode=cloudflare" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "mode=local-safe-fallback" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are unavailable for this PR; using the isolated local preview contract." >&2
          fi

      - name: Set isolated preview identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          suffix="${PREVIEW_PR_NUMBER:-manual}"
          worker_name="samson-pr-${suffix}-preview"
          echo "worker_name=$worker_name" >> "$GITHUB_OUTPUT"

      - name: Generate isolated Cloudflare preview config
        if: steps.cloudflare.outputs.available == 'true'
        env:
          PREVIEW_WORKER_NAME: ${{ steps.identity.outputs.worker_name }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const workerName = process.env.PREVIEW_WORKER_NAME;
          if (!workerName) throw new Error('PREVIEW_WORKER_NAME is required');

          writeFileSync(
            'preview-worker.generated.js',
            `export default {
              async fetch(request, env) {
                const url = new URL(request.url);
                if (url.pathname === "/src/games/meja-it/") {
                  url.pathname = "/src/games/meja-it/index.html";
                  return env.ASSETS.fetch(new Request(url, request));
                }
                return env.ASSETS.fetch(request);
              }
            };\n`
          );

          writeFileSync(
            'wrangler.pr-preview.generated.jsonc',
            `${JSON.stringify({
              $schema: 'node_modules/wrangler/config-schema.json',
              name: workerName,
              main: './preview-worker.generated.js',
              compatibility_date: '2026-09-02',
              assets: {
                directory: './dist',
                binding: 'ASSETS',
                run_worker_first: true
              }
            }, null, 2)}\n`
          );
          NODE

      - name: Deploy isolated Cloudflare preview
        id: deploy
        if: steps.cloudflare.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/samson-preview-deploy.log"
          npx wrangler deploy --config wrangler.pr-preview.generated.jsonc 2>&1 | tee "$deploy_log"
          preview_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$deploy_log" | tail -n 1 || true)"
          if [[ -z "$preview_url" ]]; then
            echo "Preview URL not found in Wrangler output." >&2
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Start isolated local preview fallback
        id: local
        if: steps.cloudflare.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4175 --bind 127.0.0.1 --directory dist \
            > "$RUNNER_TEMP/samson-local-preview.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/samson-local-preview.pid"
          for attempt in {1..20}; do
            if curl --silent --show-error --fail --location --max-time 10 \
              http://127.0.0.1:4175/version.json > /dev/null; then
              echo "preview_url=http://127.0.0.1:4175" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 1
          done
          echo "Local preview did not become ready." >&2
          sed -n '1,80p' "$RUNNER_TEMP/samson-local-preview.log" >&2 || true
          exit 1

      - name: Verify deployed preview contract
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url || steps.local.outputs.preview_url }}
          EXPECTED_SHA: ${{ env.PREVIEW_SHA }}
          PREVIEW_RETRY_ATTEMPTS: ${{ steps.cloudflare.outputs.available == 'true' && '30' || '1' }}
          PREVIEW_RETRY_DELAY_MS: ${{ steps.cloudflare.outputs.available == 'true' && '5000' || '0' }}
        run: node scripts/verify-preview.mjs

      - name: Publish preview verification summary
        if: always()
        env:
          PREVIEW_MODE: ${{ steps.cloudflare.outputs.mode }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url || steps.local.outputs.preview_url }}
          PREVIEW_WORKER_NAME: ${{ steps.identity.outputs.worker_name }}
        shell: bash
        run: |
          {
            echo "## SAMSON Preview Verification"
            echo ""
            echo "- Required check context: preview-verification"
            echo "- Revision: $PREVIEW_SHA"
            echo "- Mode: ${PREVIEW_MODE:-unknown}"
            echo "- Preview: ${PREVIEW_URL:-unavailable}"
            if [[ "${PREVIEW_MODE:-}" == "cloudflare" ]]; then
              echo "- Isolated Worker: $PREVIEW_WORKER_NAME"
            fi
            echo "- Contracts: version SHA, root application, redirects, and MEJA-IT route"
            echo "- Production domain: unchanged"
          } >> "$GITHUB_STEP_SUMMARY"
