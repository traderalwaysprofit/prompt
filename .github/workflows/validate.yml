name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      prompt_name:
        description: "Alias prompt, contoh: /landing-audit"
        required: false
        type: string
      category_id:
        description: "Category ID dari data/categories.json, contoh: coding"
        required: false
        type: string
      description:
        description: "Deskripsi singkat prompt"
        required: false
        type: string
      template:
        description: "Isi template prompt; gunakan [TOPIK] untuk variabel"
        required: false
        type: string
      example:
        description: "Contoh perintah lengkap untuk pengguna"
        required: false
        type: string
      workflow_id:
        description: "Opsional: tambahkan referensi prompt ke workflow"
        required: false
        default: none
        type: choice
        options:
          - none
          - build-website
          - build-saas
          - marketing-campaign
          - seo-content
          - research-project
          - automate-task
      workflow_step:
        description: "Nomor step jika workflow dipilih"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate runtime data
        run: npm run validate:data

      - name: Validate data regression
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASELINE_REF="origin/$GITHUB_BASE_REF"
          else
            BASELINE_REF="HEAD^"
          fi
          npm run validate:regression -- "$BASELINE_REF"

      - name: Report prompt workflow coverage
        run: npm run report:prompt-coverage -- "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}"

      - name: Build production output
        run: npm run build

      - name: Validate security policy
        run: npm run validate:security-headers

      - name: Verify release contract
        run: |
          test -s dist/index.html
          test -s dist/favicon.svg
          test -s dist/_headers
          test -s dist/version.json
          test -s dist/src/main.js
          test -s dist/src/app-shell.js
          test -s dist/src/cheatcodes.js
          test -s dist/src/cheatcodes.css
          test -s dist/data/commands.json
          test -s dist/data/commands-extra.json
          test -s dist/data/cheatcodes.json
          grep -q "data/commands.json" dist/src/main.js
          grep -q "data/commands-extra.json" dist/src/main.js
          ! grep -q "commands-v2.js" dist/src/main.js
          ! grep -q "MutationObserver" dist/src/app-shell.js

      - name: Validation summary
        if: always()
        run: |
          {
            echo "## Validate"
            echo ""
            echo "- Locked install: npm ci"
            echo "- Runtime contract: minimum 197 prompts, examples 1:1, active cheatcodes"
            echo "- Dynamic catalog counts: prompts, categories, and workflows"
            echo "- Regression protection: unapproved deletion blocked; retired IDs remain reserved"
            echo "- Build contract: static assets + version metadata"
            echo "- Security policy: strict CSP and required response headers"
          } >> "$GITHUB_STEP_SUMMARY"

  extract-via-pr:
    name: extract-via-pr
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Extract and validate Command Data V2
        run: |
          node scripts/extract-command-data-v2.mjs
          npm run validate:data

      - name: Detect generated changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/commands.json data/categories.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated branch
        id: commit
        if: steps.changes.outputs.changed == 'true'
        env:
          UPDATE_BRANCH: automation/command-data-v2-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$UPDATE_BRANCH"
          git add data/commands.json data/categories.json
          git commit -m "chore: extract Command Data V2 from source"
          git push --set-upstream origin "$UPDATE_BRANCH"
          echo "branch=$UPDATE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open generated-data pull request
        id: pull-request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          PR_URL="$(gh pr create \
            --base main \
            --head "$UPDATE_BRANCH" \
            --title "Update generated Command Data V2" \
            --body "Automated extraction from data/source/command-data-v1.html. Validation passed; review and merge this update through the protected pull-request workflow.")"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Extraction summary
        if: always()
        env:
          CHANGED: ${{ steps.changes.outputs.changed }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
        run: |
          {
            echo "## Extract via pull request"
            echo ""
            if [ "$CHANGED" = "true" ]; then
              echo "- Direct push to main: blocked"
              echo "- Pull request: $PR_URL"
            else
              echo "- Generated changes: none"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  add-prompt-via-pr:
    name: add-prompt-via-pr
    if: github.event_name == 'workflow_dispatch' && inputs.prompt_name != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Add prompt and optional workflow reference
        id: prompt
        env:
          PROMPT_NAME: ${{ inputs.prompt_name }}
          PROMPT_CATEGORY_ID: ${{ inputs.category_id }}
          PROMPT_DESCRIPTION: ${{ inputs.description }}
          PROMPT_TEMPLATE: ${{ inputs.template }}
          PROMPT_EXAMPLE: ${{ inputs.example }}
          PROMPT_WORKFLOW_ID: ${{ inputs.workflow_id }}
          PROMPT_WORKFLOW_STEP: ${{ inputs.workflow_step }}
        run: npm run add:prompt

      - name: Validate generated prompt
        run: |
          npm run validate:data
          npm run validate:regression -- HEAD
          npm run report:prompt-coverage -- HEAD
          npm run build

      - name: Commit generated branch
        id: commit
        env:
          UPDATE_BRANCH: automation/add-prompt-${{ github.run_id }}-${{ github.run_attempt }}
          PROMPT_NAME: ${{ steps.prompt.outputs.prompt_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$UPDATE_BRANCH"
          git add data/commands-extra.json data/examples-extra.json data/cheatcodes.json
          git commit -m "content: add $PROMPT_NAME prompt"
          git push --set-upstream origin "$UPDATE_BRANCH"
          echo "branch=$UPDATE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open prompt pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: ${{ steps.commit.outputs.branch }}
          PROMPT_ID: ${{ steps.prompt.outputs.prompt_id }}
          PROMPT_NAME: ${{ steps.prompt.outputs.prompt_name }}
          WORKFLOW_REFERENCE: ${{ steps.prompt.outputs.workflow_reference }}
        run: |
          PR_URL="$(gh pr create \
            --base main \
            --head "$UPDATE_BRANCH" \
            --title "Add $PROMPT_NAME prompt" \
            --body "Adds prompt #$PROMPT_ID ($PROMPT_NAME) through the validated prompt intake. Workflow reference: $WORKFLOW_REFERENCE. Counts update automatically after this protected PR is approved and merged.")"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Prompt intake summary
        if: always()
        env:
          PROMPT_ID: ${{ steps.prompt.outputs.prompt_id }}
          PROMPT_NAME: ${{ steps.prompt.outputs.prompt_name }}
          WORKFLOW_REFERENCE: ${{ steps.prompt.outputs.workflow_reference }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
        run: |
          {
            echo "## Add prompt via pull request"
            echo ""
            echo "- Prompt: $PROMPT_NAME (#$PROMPT_ID)"
            echo "- Workflow reference: $WORKFLOW_REFERENCE"
            echo "- Direct push to main: blocked"
            echo "- Pull request: $PR_URL"
          } >> "$GITHUB_STEP_SUMMARY"
