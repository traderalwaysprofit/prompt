name: Security dependency lock refresh

on:
  push:
    branches:
      - security/dependency-remediation-sep-2026
    paths:
      - package.json
      - .github/workflows/security-dependency-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify requested versions in lockfile
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = {
            vitest: '4.1.11',
            coverage: '4.1.11',
            mocker: '4.1.11',
            sharp: '0.35.4'
          };
          const observed = {
            vitest: lock.packages?.['node_modules/vitest']?.version,
            coverage: lock.packages?.['node_modules/@vitest/coverage-v8']?.version,
            mocker: lock.packages?.['node_modules/@vitest/mocker']?.version,
            sharp: lock.packages?.['node_modules/sharp']?.version
          };
          for (const [key, value] of Object.entries(expected)) {
            if (observed[key] !== value) {
              console.error(`${key}: expected ${value}, got ${observed[key]}`);
              process.exit(1);
            }
          }
          console.log('Dependency lock remediation verified:', observed);
          NODE

      - name: Commit regenerated lockfile and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/security-dependency-lock.yml
          git add package-lock.json
          git commit -m "security: refresh dependency lockfile"
          git push
