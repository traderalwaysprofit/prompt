name: CI & Edge Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-edge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install Locked Dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint Runtime JavaScript
        run: npm run lint

      - name: TypeScript Strict Check
        run: npm run typecheck

      - name: Run Security & Schema Tests
        run: npm run test:run

      - name: Run Existing Tool Regression Tests
        run: npm run test:tools

      - name: Build Production Output
        run: npm run build

      - name: Validate Security Headers
        run: npm run validate:security-headers

      - name: CI Summary
        if: always()
        run: |
          {
            echo "## CI & Edge Verification"
            echo ""
            echo "- Dependency install: locked npm ci"
            echo "- Runtime lint: ESLint"
            echo "- Type contract: TypeScript strict noEmit"
            echo "- Runtime schema: Zod"
            echo "- Unit/security tests: Vitest + existing B2B regression suite"
            echo "- Production build + security-header validation"
            echo "- Production deployment remains native Cloudflare Workers Builds after protected merge to main"
          } >> "$GITHUB_STEP_SUMMARY"
