name: CI & Edge Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-edge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Locked Dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint Runtime JavaScript
        run: npm run lint

      - name: TypeScript Strict Check
        run: npm run typecheck

      - name: Run Security & Schema Tests
        run: npm run test:run

      - name: Run Existing Tool Regression Tests
        run: npm run test:tools

      - name: Build Production Output
        run: npm run build

      - name: Cloudflare Worker Dry-Run Bundle
        run: npm run verify:worker

      - name: Validate Security Headers
        run: npm run validate:security-headers

      - name: CI Summary
        if: always()
        run: |
          {
            echo "## CI & Edge Verification"
            echo ""
            echo "- Dependency install: locked npm ci"
            echo "- Runtime lint: ESLint"
            echo "- Type contract: TypeScript strict noEmit"
            echo "- Runtime schema: Zod"
            echo "- Unit/security tests: Vitest + existing B2B regression suite"
            echo "- Cloudflare bundle: Wrangler deploy --dry-run"
            echo "- Production build + security-header validation"
            echo "- Production deployment remains native Cloudflare Workers Builds after protected merge to main"
          } >> "$GITHUB_STEP_SUMMARY"
