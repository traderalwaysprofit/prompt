name: Step 5 Node Types Bootstrap

on:
  push:
    branches:
      - feat/step5-headless-visual-pipeline

permissions:
  contents: write

jobs:
  node-types:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/step5-headless-visual-pipeline

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node type definitions
        run: npm install --save-dev @types/node --no-audit --no-fund

      - name: Commit dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required"
            exit 0
          fi
          git commit -m "chore(visual): lock Node type dependency"
          git push origin HEAD:feat/step5-headless-visual-pipeline
