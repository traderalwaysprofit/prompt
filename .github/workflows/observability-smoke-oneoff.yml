name: Observability Smoke One-Off

on:
  push:
    branches:
      - ops/observability-bypass-spm

permissions:
  contents: read

jobs:
  smoke:
    name: observability-smoke-oneoff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONFIG_PATH: config/observability-targets.production.json
      OBSERVABILITY_TIMEOUT_MS: '4000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate reviewed target config
        run: npm run observability:validate
      - name: Probe monitored targets
        run: npm run observability:smoke
