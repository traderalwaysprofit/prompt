name: Production Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-verify:
    name: production-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORIGIN_URL: https://prompt-v5.traderalwaysprofit.workers.dev
      PROD_URL: https://samson.web.id
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Wait for native Cloudflare deployment
        run: |
          python - <<'PY'
          import json, os, sys, time, urllib.request

          expected = os.environ["EXPECTED_SHA"]
          production = os.environ["PROD_URL"]

          for attempt in range(1, 31):
              url = f"{production}/version.json?commit={expected}&attempt={attempt}"
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "samson-production-verify/1.0"})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      deployed = json.loads(response.read()).get("commit")
                  print(f"Attempt {attempt}: deployed={deployed}, expected={expected}")
                  if deployed == expected:
                      sys.exit(0)
              except Exception as error:
                  print(f"Attempt {attempt}: {error}")
              time.sleep(10)

          print("Timed out waiting for the expected Cloudflare deployment.")
          sys.exit(1)
          PY

      - name: Verify production HTTP contract
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request

          urls = {"origin": os.environ["ORIGIN_URL"], "production": os.environ["PROD_URL"]}
          failures = []
          required_headers = {
              "strict-transport-security": "max-age=31536000; includeSubDomains",
              "x-content-type-options": "nosniff",
              "referrer-policy": "strict-origin-when-cross-origin",
              "x-frame-options": "DENY",
              "cross-origin-opener-policy": "same-origin",
              "cross-origin-resource-policy": "same-origin",
          }
          required_csp = [
              "default-src 'self'",
              "script-src 'self'",
              "style-src 'self'",
              "object-src 'none'",
              "frame-ancestors 'none'",
              "base-uri 'self'",
              "form-action 'self'",
          ]

          def get(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "samson-production-verify/1.0", "Cache-Control": "no-cache"},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return response.status, response.headers, response.read()

          for name, base in urls.items():
              print(f"=== {name}: {base} ===")
              try:
                  status, headers, html = get(base + "/?verify=" + os.environ["EXPECTED_SHA"])
                  text = html.decode("utf-8", "replace")
                  if status != 200:
                      failures.append(f"{name} root HTTP {status}")
                  if 'id="root"' not in text or "/src/main.js" not in text:
                      failures.append(f"{name} frontend entry markers missing")

                  normalized = {key.lower(): value for key, value in headers.items()}
                  for header, expected in required_headers.items():
                      if normalized.get(header) != expected:
                          failures.append(f"{name} {header} mismatch: {normalized.get(header)!r}")

                  csp = normalized.get("content-security-policy", "")
                  for directive in required_csp:
                      if directive not in csp:
                          failures.append(f"{name} CSP missing {directive}")
                  if "'unsafe-inline'" in csp or "'unsafe-eval'" in csp:
                      failures.append(f"{name} CSP contains an unsafe token")
                  if "permissions-policy" not in normalized:
                      failures.append(f"{name} Permissions-Policy missing")

                  status, _, version_body = get(base + "/version.json?verify=" + os.environ["EXPECTED_SHA"])
                  version = json.loads(version_body)
                  if status != 200 or version.get("commit") != os.environ["EXPECTED_SHA"]:
                      failures.append(f"{name} version metadata mismatch")

                  status, _, main_js = get(base + "/src/main.js?verify=" + os.environ["EXPECTED_SHA"])
                  source = main_js.decode("utf-8", "replace")
                  if status != 200 or "/data/commands.json" not in source:
                      failures.append(f"{name} main.js contract missing")

                  _, _, base_body = get(base + "/data/commands.json?verify=" + os.environ["EXPECTED_SHA"])
                  _, _, extra_body = get(base + "/data/commands-extra.json?verify=" + os.environ["EXPECTED_SHA"])
                  _, _, categories_body = get(base + "/data/categories.json?verify=" + os.environ["EXPECTED_SHA"])
                  _, _, examples_body = get(base + "/data/examples.json?verify=" + os.environ["EXPECTED_SHA"])
                  _, _, extra_examples_body = get(base + "/data/examples-extra.json?verify=" + os.environ["EXPECTED_SHA"])
                  _, _, cheatcodes_body = get(base + "/data/cheatcodes.json?verify=" + os.environ["EXPECTED_SHA"])

                  commands = json.loads(base_body) + json.loads(extra_body)
                  categories = json.loads(categories_body)
                  examples = json.loads(examples_body) + json.loads(extra_examples_body)
                  cheatcodes = json.loads(cheatcodes_body)
                  if len(commands) < 200:
                      failures.append(f"{name} expected at least 200 commands, got {len(commands)}")
                  if len(categories) < 20:
                      failures.append(f"{name} expected at least 20 categories, got {len(categories)}")
                  if len(examples) != len(commands):
                      failures.append(f"{name} expected one example per command, got {len(examples)} examples for {len(commands)} commands")
                  command_ids = [item.get("id") for item in commands]
                  example_ids = [item.get("id") for item in examples]
                  if len(set(command_ids)) != len(commands):
                      failures.append(f"{name} duplicate command IDs detected")
                  if set(example_ids) != set(command_ids):
                      failures.append(f"{name} example IDs do not match command IDs")
                  workflow_ids = {item.get("id") for item in cheatcodes}
                  required_workflows = {"build-website", "build-saas", "marketing-campaign", "seo-content", "research-project", "automate-task"}
                  if len(cheatcodes) != 6 or workflow_ids != required_workflows:
                      failures.append(f"{name} workflow catalog contract invalid: {sorted(workflow_ids)}")
                  if cheatcodes[0].get("id") != "build-website" or len(cheatcodes[0].get("steps", [])) != 8:
                      failures.append(f"{name} Build Website workflow contract invalid")
              except Exception as error:
                  failures.append(f"{name} validation error: {error}")

          if failures:
              print("PRODUCTION VERIFY: FAIL")
              for failure in failures:
                  print("-", failure)
              sys.exit(1)

          print("PRODUCTION VERIFY: PASS")
          PY

      - name: Production summary
        if: always()
        run: |
          {
            echo "## Production Verify"
            echo ""
            echo "- Deployment: native Cloudflare Workers Builds"
            echo "- Commit: $EXPECTED_SHA"
            echo "- Origin: $ORIGIN_URL"
            echo "- Production: $PROD_URL"
            echo "- HTTP contract: frontend + runtime data + security headers"
          } >> "$GITHUB_STEP_SUMMARY"
