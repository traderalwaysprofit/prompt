name: Command Data V2 Extraction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/source/command-data-v1.html'
      - 'scripts/extract-command-data-v2.mjs'
      - '.github/workflows/command-data-v2-extraction.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: command-data-v2-extraction
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Extract V2 data
        run: node scripts/extract-command-data-v2.mjs

      - name: Validate extracted data
        run: npm run validate:data

      - name: Detect generated changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/commands.json data/categories.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push generated branch
        id: commit
        if: steps.changes.outputs.changed == 'true'
        env:
          UPDATE_BRANCH: automation/command-data-v2-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$UPDATE_BRANCH"
          git add data/commands.json data/categories.json
          git commit -m "chore: extract Command Data V2 from source"
          git push --set-upstream origin "$UPDATE_BRANCH"
          echo "branch=$UPDATE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open generated-data pull request
        id: pull-request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          PR_URL="$(gh pr create \
            --base main \
            --head "$UPDATE_BRANCH" \
            --title "Update generated Command Data V2" \
            --body "Automated extraction from data/source/command-data-v1.html. Validation completed before this pull request was opened. Review the generated command and category changes, then merge through the normal protected-branch workflow.")"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          CHANGED: ${{ steps.changes.outputs.changed }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
        run: |
          {
            echo "## Command Data V2 Extraction"
            echo ""
            echo "- Source: data/source/command-data-v1.html"
            echo "- Extractor: scripts/extract-command-data-v2.mjs"
            echo "- Validation: npm run validate:data"
            if [ "$CHANGED" = "true" ]; then
              echo "- Direct push to main: blocked by workflow design"
              echo "- Pull request: $PR_URL"
            else
              echo "- Generated changes: none"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
