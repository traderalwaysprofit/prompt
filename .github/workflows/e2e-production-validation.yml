name: E2E Production Validation

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Cloudflare Pages Deploy
    types: [completed]

permissions:
  contents: read

jobs:
  e2e-production:
    name: HTTP Contract — deployed frontend
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORIGIN_URL: https://prompt-v5.traderalwaysprofit.workers.dev
      PROD_URL: https://samson.web.id

    steps:
      - name: Validate deployed frontend and runtime data
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, urllib.request

          urls = {"origin": os.environ["ORIGIN_URL"], "production": os.environ["PROD_URL"]}
          failures = []

          def get(url):
              request = urllib.request.Request(url, headers={"User-Agent": "samson-e2e/3.0"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return response.status, response.headers.get("content-type", ""), response.read()

          for name, base in urls.items():
              print(f"=== {name}: {base} ===")
              try:
                  status, _, html = get(base + "/")
                  text = html.decode("utf-8", "replace")
                  if status != 200:
                      failures.append(f"{name} root HTTP {status}")
                  if 'id="root"' not in text or "/src/main.js" not in text:
                      failures.append(f"{name} current frontend entry markers missing")

                  status, _, main_js = get(base + "/src/main.js")
                  source = main_js.decode("utf-8", "replace")
                  if status != 200 or "/data/commands.json" not in source or "/data/commands-extra.json" not in source:
                      failures.append(f"{name} main.js runtime data references missing")

                  status, content_type, favicon = get(base + "/favicon.svg")
                  if status != 200 or b"<svg" not in favicon or "svg" not in content_type.lower():
                      failures.append(f"{name} favicon.svg missing or invalid")

                  _, _, base_body = get(base + "/data/commands.json")
                  _, _, extra_body = get(base + "/data/commands-extra.json")
                  _, _, categories_body = get(base + "/data/categories.json")
                  _, _, examples_body = get(base + "/data/examples.json")
                  _, _, extra_examples_body = get(base + "/data/examples-extra.json")

                  commands = json.loads(base_body) + json.loads(extra_body)
                  categories = json.loads(categories_body)
                  examples = json.loads(examples_body) + json.loads(extra_examples_body)

                  if len(commands) != 200:
                      failures.append(f"{name} expected 200 runtime commands, got {len(commands)}")
                  if len(categories) != 20:
                      failures.append(f"{name} expected 20 categories, got {len(categories)}")
                  if len(examples) != 200:
                      failures.append(f"{name} expected 200 examples, got {len(examples)}")

                  ids = [command.get("id") for command in commands if isinstance(command, dict)]
                  if len(ids) != len(set(ids)):
                      failures.append(f"{name} duplicate command IDs")

                  category_ids = {category.get("id") for category in categories if isinstance(category, dict)}
                  for command in commands:
                      if not isinstance(command, dict):
                          failures.append(f"{name} command entry is not an object")
                          continue
                      if any(not command.get(field) for field in ("name", "categoryId", "description", "template")):
                          failures.append(f"{name} command {command.get('id')} contract incomplete")
                      if command.get("categoryId") not in category_ids:
                          failures.append(f"{name} command {command.get('id')} has invalid categoryId")
              except Exception as error:
                  failures.append(f"{name} validation error: {error}")

          if failures:
              print()
              print("E2E FAIL")
              for failure in failures:
                  print("-", failure)
              sys.exit(1)

          print()
          print("E2E PASS: deployed frontend, favicon, and 200-command runtime contract are healthy.")
          PY

      - name: Write E2E summary
        if: always()
        run: |
          {
            echo "## E2E Production Validation"
            echo ""
            echo "- Origin: $ORIGIN_URL"
            echo "- Production: $PROD_URL"
            echo "- Frontend entry: root + main.js"
            echo "- Runtime data: 200 commands + 20 categories + 200 examples"
            echo "- Required fields: name, categoryId, description, template"
            echo "- Static asset: favicon.svg"
          } >> "$GITHUB_STEP_SUMMARY"
