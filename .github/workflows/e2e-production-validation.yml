name: E2E Production Validation

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Cloudflare Pages Deploy
    types: [completed]

permissions:
  contents: read

jobs:
  e2e-production:
    name: Validate production origin and canonical domain
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate production endpoints
        env:
          ORIGIN_URL: https://prompt-v2.traderalwaysprofit.workers.dev
          PROD_URL: https://samson.web.id
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, urllib.request

          urls = {
              "origin": os.environ["ORIGIN_URL"],
              "production": os.environ["PROD_URL"],
          }

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "samson-e2e/1.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  body = r.read()
                  return r.status, r.headers.get("content-type", ""), body

          failures = []
          for name, base in urls.items():
              print(f"=== {name}: {base} ===")
              status, content_type, html = get(base + "/")
              print("HTTP /:", status, content_type, len(html))
              if status != 200:
                  failures.append(f"{name} / returned HTTP {status}")

              status, content_type, body = get(base + "/data/commands.json")
              print("HTTP /data/commands.json:", status, content_type, len(body))
              if status != 200:
                  failures.append(f"{name} commands returned HTTP {status}")
                  continue
              try:
                  commands = json.loads(body)
              except Exception as e:
                  failures.append(f"{name} commands JSON invalid: {e}")
                  continue
              if not isinstance(commands, list):
                  failures.append(f"{name} commands is not an array")
              elif len(commands) != 193:
                  failures.append(f"{name} expected 193 commands, got {len(commands)}")
              ids = [str(x.get("id")) for x in commands if isinstance(x, dict)]
              if len(ids) != len(set(ids)):
                  failures.append(f"{name} command IDs are not unique")

              status, content_type, body = get(base + "/data/categories.json")
              print("HTTP /data/categories.json:", status, content_type, len(body))
              if status != 200:
                  failures.append(f"{name} categories returned HTTP {status}")
                  continue
              try:
                  categories = json.loads(body)
              except Exception as e:
                  failures.append(f"{name} categories JSON invalid: {e}")
                  continue
              if not isinstance(categories, list):
                  failures.append(f"{name} categories is not an array")
              elif len(categories) != 20:
                  failures.append(f"{name} expected 20 categories, got {len(categories)}")

          if failures:
              print("\nE2E FAIL")
              for failure in failures:
                  print("-", failure)
              sys.exit(1)

          print("\nE2E PASS: origin and canonical production contain 193 commands and 20 categories.")
          PY

      - name: Write E2E summary
        if: always()
        run: |
          {
            echo "## E2E Production Validation"
            echo ""
            echo "- Origin: \\`https://prompt-v2.traderalwaysprofit.workers.dev\\`"
            echo "- Canonical production: \\`https://samson.web.id\\`"
            echo "- Root endpoint: HTTP 200 required"
            echo "- commands.json: 193 commands + unique IDs"
            echo "- categories.json: 20 categories"
          } >> "$GITHUB_STEP_SUMMARY"
