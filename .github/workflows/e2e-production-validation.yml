name: E2E Production Validation

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Cloudflare Pages Deploy
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'data/**'
      - '.github/workflows/e2e-production-validation.yml'

permissions:
  contents: read

jobs:
  e2e-production:
    name: E2E Production Validation — prompt-v5
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORIGIN_URL: https://prompt-v5.traderalwaysprofit.workers.dev
      PROD_URL: https://samson.web.id

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production endpoints and Command Data V2
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, sys, urllib.request

          urls = {"origin": os.environ["ORIGIN_URL"], "production": os.environ["PROD_URL"]}
          failures = []

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "samson-e2e/2.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.status, r.headers.get("content-type", ""), r.read()

          for name, base in urls.items():
              print(f"=== {name}: {base} ===")
              try:
                  status, content_type, html = get(base + "/")
                  print("ROOT", status, content_type, len(html))
                  if status != 200: failures.append(f"{name} root HTTP {status}")
                  text = html.decode("utf-8", "replace")
                  if "193" not in text and "Peta Perintah" not in text:
                      failures.append(f"{name} frontend identity marker missing")
                  if "commands.json" not in text:
                      failures.append(f"{name} frontend does not reference commands.json")
              except Exception as e:
                  failures.append(f"{name} root unavailable: {e}")
                  continue

              try:
                  status, content_type, body = get(base + "/data/commands.json")
                  print("COMMANDS", status, content_type, len(body))
                  if status != 200: failures.append(f"{name} commands HTTP {status}")
                  commands = json.loads(body)
                  if not isinstance(commands, list) or len(commands) != 193:
                      failures.append(f"{name} expected 193 commands")
                  ids = [str(x.get("id")) for x in commands if isinstance(x, dict)]
                  if len(ids) != len(set(ids)): failures.append(f"{name} duplicate command IDs")
                  if any(not x.get("cmd") or not x.get("category") for x in commands if isinstance(x, dict)):
                      failures.append(f"{name} command contract incomplete")
              except Exception as e:
                  failures.append(f"{name} commands invalid: {e}")

              try:
                  status, content_type, body = get(base + "/data/categories.json")
                  print("CATEGORIES", status, content_type, len(body))
                  if status != 200: failures.append(f"{name} categories HTTP {status}")
                  categories = json.loads(body)
                  if not isinstance(categories, list) or len(categories) != 20:
                      failures.append(f"{name} expected 20 categories")
              except Exception as e:
                  failures.append(f"{name} categories invalid: {e}")

          if failures:
              print("\nE2E FAIL")
              for failure in failures: print("-", failure)
              sys.exit(1)
          print("\nE2E PASS: prompt-v5 origin and samson.web.id production are healthy.")
          PY

      - name: Write E2E summary
        if: always()
        run: |
          {
            echo "## E2E Production Validation — prompt-v5"
            echo ""
            echo "- Origin: \\`$ORIGIN_URL\\`"
            echo "- Production: \\`$PROD_URL\\`"
            echo "- Root: HTTP 200 + frontend identity"
            echo "- Command Data V2: 193 commands + unique IDs"
            echo "- Categories: 20"
          } >> "$GITHUB_STEP_SUMMARY"
