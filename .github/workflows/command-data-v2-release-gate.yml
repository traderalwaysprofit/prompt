name: Command Data V2 Release Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/command-data-v2-release-gate.yml'
      - '.github/workflows/command-data-v2-validation.yml'
      - '.github/workflows/command-data-v2-schema-validation.yml'
      - '.github/workflows/command-data-v2-regression-validation.yml'

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify generated data exists
        run: |
          test -s data/commands.json
          test -s data/categories.json

      - name: Validate JSON and command count
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const commands = JSON.parse(readFileSync('data/commands.json', 'utf8'));
          const categories = JSON.parse(readFileSync('data/categories.json', 'utf8'));
          if (commands.length !== 193) throw new Error(`Expected 193 commands, got ${commands.length}`);
          if (categories.length !== 20) throw new Error(`Expected 20 categories, got ${categories.length}`);
          if (new Set(commands.map(c => c.id)).size !== 193) throw new Error('Command IDs must be unique');
          console.log('Command Data V2 release gate checks passed.');
          NODE

      - name: Verify frontend data contract
        run: |
          test -f src/main.js
          grep -q "data/commands.json" src/main.js
          grep -q "data/categories.json" src/main.js
          echo "Frontend data contract: PASS"

      - name: Release gate summary
        run: |
          {
            echo "## Command Data V2 Release Gate"
            echo ""
            echo "✅ Generated data present"
            echo "✅ JSON valid"
            echo "✅ 193 commands"
            echo "✅ 20 categories"
            echo "✅ Unique command IDs"
            echo "✅ Frontend data contract"
            echo ""
            echo "### Result: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
