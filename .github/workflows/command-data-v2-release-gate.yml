name: Command Data V2 Release Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'src/**'
      - 'favicon.svg'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/command-data-v2-release-gate.yml'
      - '.github/workflows/command-data-v2-validation.yml'
      - '.github/workflows/command-data-v2-schema-validation.yml'
      - '.github/workflows/command-data-v2-regression-validation.yml'

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate complete runtime data
        run: npm run validate:data

      - name: Build release output
        run: npm run build

      - name: Verify release artifacts
        run: |
          test -s dist/index.html
          test -s dist/favicon.svg
          test -s dist/src/main.js
          test -s dist/src/app-shell.js
          test -s dist/data/commands.json
          test -s dist/data/commands-extra.json
          grep -q "data/commands.json" dist/src/main.js
          grep -q "data/commands-extra.json" dist/src/main.js

      - name: Release gate summary
        run: |
          {
            echo "## Command Data V2 Release Gate"
            echo ""
            echo "PASS: complete 200-command runtime data"
            echo "PASS: 20 categories and 200 examples"
            echo "PASS: static build and favicon"
            echo "PASS: current frontend data contract"
          } >> "$GITHUB_STEP_SUMMARY"
