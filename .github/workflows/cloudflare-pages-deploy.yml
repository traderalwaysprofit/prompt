name: Cloudflare Pages Deploy

on:
  workflow_run:
    workflows:
      - Command Data V2 Release Gate
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build production assets
        run: npm run build

      - name: Verify production data payload
        run: |
          test -s dist/index.html
          test -s dist/data/commands.json
          test -s dist/data/categories.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const commands = JSON.parse(readFileSync('dist/data/commands.json', 'utf8'));
          const categories = JSON.parse(readFileSync('dist/data/categories.json', 'utf8'));
          if (commands.length !== 193) throw new Error(`Expected 193 commands, got ${commands.length}`);
          if (categories.length !== 20) throw new Error(`Expected 20 categories, got ${categories.length}`);
          console.log('Production payload verified.');
          NODE

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-message="${{ github.sha }} Command Data V2 release"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deployment summary
        run: |
          {
            echo "## Cloudflare Pages Deployment"
            echo ""
            echo "✅ Release gate passed"
            echo "✅ Production assets built"
            echo "✅ Command Data V2 payload verified"
            echo "✅ Cloudflare Pages deployment command completed"
          } >> "$GITHUB_STEP_SUMMARY"
