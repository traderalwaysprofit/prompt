name: Command Data V2 Regression Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/command-data-v2-regression-validation.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'data/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/command-data-v2-regression-validation.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate complete runtime data
        run: npm run validate:data

      - name: Build static frontend
        run: npm run build

      - name: Verify current frontend contract
        run: |
          test -s dist/index.html
          test -s dist/favicon.svg
          test -s dist/src/main.js
          test -s dist/src/app-shell.js
          grep -q "data/commands.json" dist/src/main.js
          grep -q "data/commands-extra.json" dist/src/main.js
          ! grep -q "commands-v2.js" dist/src/main.js
          ! grep -q "MutationObserver" dist/src/app-shell.js
          echo "Frontend runtime contract passed."

      - name: Regression summary
        if: always()
        run: |
          {
            echo "## Command Data V2 Regression Validation"
            echo ""
            echo "- Runtime commands: 200"
            echo "- Runtime examples: 200"
            echo "- Categories: 20"
            echo "- Static build + favicon"
            echo "- Canonical app shell without global MutationObserver"
          } >> "$GITHUB_STEP_SUMMARY"
