name: Command Data V2 Regression Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/command-data-v2-regression-validation.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run data validation
        run: npm run validate:data

      - name: Verify Command Data V2 runtime contract
        shell: bash
        run: |
          test -s data/commands.json
          test -s data/categories.json
          node <<'NODE'
          const commands = require('./data/commands.json');
          const categories = require('./data/categories.json');
          if (commands.length !== 193) throw new Error(`Expected 193 commands, got ${commands.length}`);
          if (!Array.isArray(categories) || categories.length !== 20) throw new Error(`Expected 20 categories, got ${categories.length}`);
          const ids = new Set(commands.map(c => c.id));
          if (ids.size !== 193) throw new Error('Command IDs are not unique');
          for (const c of commands) {
            if (!c.name || !c.categoryId || !c.description || !c.template) throw new Error(`Incomplete command: ${c.id}`);
          }
          console.log('Runtime contract passed: 193 commands, 20 categories, unique IDs, required fields present.');
          NODE

      - name: Frontend regression smoke test
        run: |
          test -f src/main.js
          grep -q "data/commands.json" src/main.js
          grep -q "data/categories.json" src/main.js
          ! grep -q "commands-v2.js" src/main.js
          echo "Frontend is wired to extracted JSON data and not legacy commands-v2.js."

      - name: Regression summary
        run: |
          {
            echo "## Command Data V2 Regression Validation"
            echo ""
            echo "✅ Data validation"
            echo "✅ 193 commands"
            echo "✅ 20 categories"
            echo "✅ Unique command IDs"
            echo "✅ Required runtime fields"
            echo "✅ Frontend → extracted JSON contract"
            echo ""
            echo "### Result: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
