name: Deploy MASUMI CRM Preview

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: masumi-crm-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/masumi-crm-cloud' &&
      github.event.label.name == 'deploy-masumi-preview')
    name: deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: masumi-crm-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CRM_PREVIEW_DATABASE_NAME: masumi-crm-preview
      NO_COLOR: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare environment secrets are not configured." >&2
            exit 1
          fi
          npx wrangler whoami

      - name: Run CRM verification
        run: |
          npm run test:masumi-crm-cloud
          npm run test:masumi-crm-d1
          npm run test:masumi-crm-api
          npm run test:masumi-crm-ui
          node scripts/test-masumi-crm-preview-config.mjs
          npm run build:masumi-crm-cloud

      - name: Resolve isolated preview database
        id: database
        shell: bash
        run: |
          set -euo pipefail
          list_file="$RUNNER_TEMP/masumi-crm-d1-list.json"
          npx wrangler d1 list --json > "$list_file"
          database_id="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const rows = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const match = rows.find((row) => row.name === process.env.CRM_PREVIEW_DATABASE_NAME);
            if (match) process.stdout.write(match.uuid || match.id || "");
          ' "$list_file")"

          if [[ -z "$database_id" ]]; then
            npx wrangler d1 create "$CRM_PREVIEW_DATABASE_NAME"
            npx wrangler d1 list --json > "$list_file"
            database_id="$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const rows = JSON.parse(readFileSync(process.argv[1], "utf8"));
              const match = rows.find((row) => row.name === process.env.CRM_PREVIEW_DATABASE_NAME);
              if (match) process.stdout.write(match.uuid || match.id || "");
            ' "$list_file")"
          fi

          if [[ -z "$database_id" ]]; then
            echo "Unable to resolve the preview D1 database ID." >&2
            exit 1
          fi

          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Generate preview-only Wrangler config
        run: node scripts/configure-masumi-crm-preview.mjs "${{ steps.database.outputs.database_id }}"

      - name: Apply preview migrations
        run: >-
          npx wrangler d1 migrations apply "$CRM_PREVIEW_DATABASE_NAME"
          --remote --config wrangler.crm.preview.generated.jsonc --env preview

      - name: Deploy preview Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/masumi-crm-preview-deploy.log"
          npx wrangler deploy --config wrangler.crm.preview.generated.jsonc --env preview 2>&1 | tee "$deploy_log"
          preview_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$deploy_log" | tail -n 1 || true)"
          if [[ -z "$preview_url" ]]; then
            echo "Wrangler did not report a workers.dev preview URL." >&2
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Smoke test preview
        id: smoke
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/masumi-crm-health-response"
          status="$(curl --silent --show-error --max-time 30 --retry 4 \
            --output "$response_file" --write-out '%{http_code}' \
            "$PREVIEW_URL/api/crm/v1/health")"

          if [[ "$status" == "200" ]]; then
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const payload = JSON.parse(readFileSync(process.argv[1], "utf8"));
              if (!payload.success || payload.environment !== "preview" || !payload.databaseConfigured) {
                throw new Error("Preview health response is not ready.");
              }
            ' "$response_file"
            echo "result=health-verified" >> "$GITHUB_OUTPUT"
          elif [[ "$status" == "302" || "$status" == "403" ]]; then
            echo "Cloudflare Access blocked the anonymous smoke request as expected."
            echo "result=access-protected" >> "$GITHUB_OUTPUT"
          elif [[ "$status" == "404" ]] && grep -Fxq "error code: 1042" "$response_file"; then
            echo "::warning::The GitHub runner egress crossed another Worker on the workers.dev zone. Browser verification is required for this preview URL."
            echo "result=runner-1042-browser-verified" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected preview health status: $status" >&2
            sed -n '1,20p' "$response_file" >&2
            exit 1
          fi

      - name: Publish deployment summary
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          DATABASE_ID: ${{ steps.database.outputs.database_id }}
          SMOKE_RESULT: ${{ steps.smoke.outputs.result }}
        run: |
          {
            echo "## MASUMI CRM preview"
            echo ""
            echo "- Worker: \`samson-masumi-crm-preview\`"
            echo "- URL: $PREVIEW_URL"
            echo "- D1: \`masumi-crm-preview\` (\`$DATABASE_ID\`)"
            echo "- Smoke: \`$SMOKE_RESULT\`"
            echo "- Production domain and production D1: unchanged"
          } >> "$GITHUB_STEP_SUMMARY"
