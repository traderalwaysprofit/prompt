name: Provision MASUMI CRM Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: masumi-crm-staging-provision
  cancel-in-progress: false

jobs:
  provision-staging:
    name: provision-staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: masumi-crm-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CRM_PREVIEW_ADMIN_EMAIL: ${{ secrets.CRM_PREVIEW_ADMIN_EMAIL }}
      CRM_STAGING_HOSTNAME: ${{ vars.CRM_STAGING_HOSTNAME || 'crm-preview.samson.web.id' }}
      CRM_PREVIEW_DATABASE_NAME: masumi-crm-preview
      NO_COLOR: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate staging inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare environment secrets are not configured." >&2
            exit 1
          fi
          if [[ -z "${CRM_PREVIEW_ADMIN_EMAIL:-}" ]]; then
            echo "CRM_PREVIEW_ADMIN_EMAIL is not configured in the masumi-crm-preview environment." >&2
            exit 1
          fi
          if [[ "$CRM_STAGING_HOSTNAME" != *preview*.samson.web.id ]]; then
            echo "Refusing to provision a non-preview hostname: $CRM_STAGING_HOSTNAME" >&2
            exit 1
          fi
          npx wrangler whoami

      - name: Run staging provisioning tests
        run: |
          npm run test:masumi-crm-staging-provision
          node scripts/test-masumi-crm-preview-config.mjs
          npm run test:masumi-crm-cloud
          npm run test:masumi-crm-d1
          npm run test:masumi-crm-api
          npm run test:masumi-crm-ui

      - name: Resolve isolated preview database
        id: database
        shell: bash
        run: |
          set -euo pipefail
          list_file="$RUNNER_TEMP/masumi-crm-d1-list.json"
          npx wrangler d1 list --json > "$list_file"
          database_id="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const rows = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const match = rows.find((row) => row.name === process.env.CRM_PREVIEW_DATABASE_NAME);
            if (match) process.stdout.write(match.uuid || match.id || "");
          ' "$list_file")"

          if [[ -z "$database_id" ]]; then
            npx wrangler d1 create "$CRM_PREVIEW_DATABASE_NAME"
            npx wrangler d1 list --json > "$list_file"
            database_id="$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const rows = JSON.parse(readFileSync(process.argv[1], "utf8"));
              const match = rows.find((row) => row.name === process.env.CRM_PREVIEW_DATABASE_NAME);
              if (match) process.stdout.write(match.uuid || match.id || "");
            ' "$list_file")"
          fi

          if [[ -z "$database_id" ]]; then
            echo "Unable to resolve the preview D1 database ID." >&2
            exit 1
          fi
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Ensure Cloudflare Access staging application
        id: access
        shell: bash
        run: |
          set -euo pipefail
          result_file="$RUNNER_TEMP/masumi-crm-staging.json"
          node scripts/provision-masumi-crm-staging.mjs > "$result_file"
          node --input-type=module - "$result_file" "$GITHUB_OUTPUT" <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const lines = [
            `hostname=${result.hostname}`,
            `application_id=${result.applicationId}`,
            `application_action=${result.applicationAction}`,
            `policy_action=${result.policyAction}`,
            `audience=${result.audience}`,
            `issuer=${result.issuer}`
          ];
          appendFileSync(process.argv[3], `${lines.join('\n')}\n`);
          NODE

      - name: Generate protected staging Wrangler config
        env:
          CRM_ACCESS_AUD: ${{ steps.access.outputs.audience }}
          CRM_ACCESS_ISSUER: ${{ steps.access.outputs.issuer }}
        run: node scripts/configure-masumi-crm-preview.mjs "${{ steps.database.outputs.database_id }}"

      - name: Apply staging migrations
        run: >-
          npx wrangler d1 migrations apply "$CRM_PREVIEW_DATABASE_NAME"
          --remote --config wrangler.crm.preview.generated.jsonc --env preview

      - name: Build CRM staging application
        run: npm run build:masumi-crm-cloud

      - name: Deploy protected staging Worker
        run: npx wrangler deploy --config wrangler.crm.preview.generated.jsonc --env preview

      - name: Verify Access gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          target="https://${CRM_STAGING_HOSTNAME}/api/crm/v1/health"
          status=""
          for attempt in {1..10}; do
            status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$target" || true)"
            if [[ "$status" == "302" || "$status" == "403" ]]; then
              echo "Access gate is active (HTTP $status)."
              echo "result=access-protected" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "Expected Cloudflare Access to protect $target, got HTTP ${status:-none}." >&2
          exit 1

      - name: Publish staging summary
        env:
          ACCESS_APP_ACTION: ${{ steps.access.outputs.application_action }}
          ACCESS_POLICY_ACTION: ${{ steps.access.outputs.policy_action }}
          ACCESS_GATE_RESULT: ${{ steps.gate.outputs.result }}
        run: |
          {
            echo "## MASUMI CRM staging"
            echo ""
            echo "- Hostname: https://$CRM_STAGING_HOSTNAME"
            echo "- Worker: \`samson-masumi-crm-preview\`"
            echo "- D1: \`masumi-crm-preview\`"
            echo "- Access app: \`$ACCESS_APP_ACTION\`"
            echo "- Access policy: \`$ACCESS_POLICY_ACTION\`"
            echo "- Access gate: \`$ACCESS_GATE_RESULT\`"
            echo "- workers.dev: disabled for this protected staging deployment"
            echo "- Production domain and production D1: unchanged"
          } >> "$GITHUB_STEP_SUMMARY"
