name: E2E Production Browser Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'data/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-production-browser.yml'

permissions:
  contents: read

jobs:
  browser-e2e:
    name: Browser E2E — samson.web.id
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD_URL: https://samson.web.id

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-production-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
